[project]
name = "msfinancas-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "MateusRabelo",email = "mateusaqles@gmail.com"}
]
requires-python = ">=3.11,<3.16"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "pydantic-settings (>=2.16.1,<3.0.0)",
    "email-validator (>=2.0.0,<3.0.0)",
    "sqlalchemy (>=2.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "psycopg[binary] (>=3.2.0,<4.0.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "pwdlib[argon2,bcrypt] (>=0.3.1,<0.4.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pypdf (>=6,<7)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
